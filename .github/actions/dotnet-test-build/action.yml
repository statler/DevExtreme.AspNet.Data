name: dotnet-test-build
description: Builds the fork's .NET 10 test solution in Debug configuration, with NuGet cache

runs:
  using: "composite"

  steps:
  - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    with:
      dotnet-quality: ga
      dotnet-version: 10.0.x

  - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
    with:
      key: ${{ runner.os }}-nuget-${{ hashFiles('net/**/*.csproj', 'net/Directory.Packages.props') }}
      restore-keys: ${{ runner.os }}-nuget-
      path: ~/.nuget/packages

  - shell: bash
    run: dotnet build -c Debug net/DXAutomap.AspNet.Data.slnx -m:1 -nodeReuse:false -p:UseSharedCompilation=false
